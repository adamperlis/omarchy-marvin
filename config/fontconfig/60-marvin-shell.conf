<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Marvin: Inter for the shell, and only the shell.

  The Omarchy shell asks fontconfig for "monospace" and has no other knob.
  `omarchy font set` rewrites ~/.config/fontconfig/fonts.conf and every
  terminal together, so a proportional face cannot go in that way. This rule
  is scoped to the shell's process name, so terminals keep their monospace
  font and can still be changed with `omarchy font set`. Icon glyphs are
  private-use codepoints Inter does not carry; fontconfig falls through to
  the Nerd Font for them as before.
-->
<fontconfig>
  <match target="pattern">
    <test name="prgname"><string>quickshell</string></test>
    <test name="family" qual="any"><string>monospace</string></test>
    <edit name="family" mode="prepend_first" binding="strong">
      <string>Inter</string>
    </edit>
  </match>

  <!--
    And no grid fitting, also only for the shell.

    Arch ships 10-hinting-slight.conf, which fits glyphs to the pixel grid
    vertically. Baseline and x-height snap, but the overshoot a type designer
    puts on round glyphs does not, and at the bar's 13-14px that overshoot
    rounds to a whole pixel: 0 3 6 8 9 land one pixel below 1 2 4 5 7. In a
    clock reading 11:30 the 30 visibly hangs under the 11, and a temperature
    of 23 has a short 2 beside a tall 3.

    hintnone keeps the outlines as drawn and lets antialiasing carry the
    overshoot at sub-pixel size, so a row of digits reads as one row. The
    shell asks for these sizes and the trade — slightly softer text — is worth
    it there. prgname keeps it off everything else: terminals and apps stay on
    hintslight, which is what you want for a wall of small monospace.
  -->
  <match target="font">
    <test target="pattern" name="prgname"><string>quickshell</string></test>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintnone</const></edit>
  </match>
</fontconfig>
