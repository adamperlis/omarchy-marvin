# Marvin shell surfaces. Hand-written; replaces the generated shell.toml.
# Depth comes from surfaces: a hairline at 8% of the text colour and, in the
# config layer, a wide faint shadow. Never a structural border. Tone is a surface property — base
# for the bar, raised for anything that opens over it.

[bar]
background       = "#f5f5f5"
background-alpha = 1.0
text             = "#1a1a1a"
active           = "#2f93d3"
scale-with-font  = false
size-horizontal  = 32
size-vertical    = 32
icon-slot        = 32
icon-canvas      = 16
icon-font        = 16
status-slot      = 24

[hyprland]
active-border            = "rgba(1a1a1a8c)"
active-border-foreground = "rgba(1a1a1a8c)"

[controls]
# Fill is the text color at alpha, so controls survive any surface tone.
# Emphasis rises monotonically: 0.04 -> 0.05 -> 0.07 -> 0.09. The reference's
# Search pill is #f4f4f4 on white and its button #f1f1f1; dark needs more. Focus is the
# selected fill plus a hairline of the text colour: visible, distinct from
# hover, and never an accent outline — inputs in the reference have none.
normal-color        = "#1a1a1a"
normal-fill-alpha   = 0.04
normal-border       = "#1a1a1a"
normal-border-width = 0
normal-border-alpha = 0

hover-cursor-color        = "#1a1a1a"
hover-cursor-fill-alpha   = 0.05
hover-cursor-border       = "#1a1a1a"
hover-cursor-border-width = 0
hover-cursor-border-alpha = 0

focus-color        = "#1a1a1a"
focus-fill-alpha   = 0.07
focus-border       = "#1a1a1a"
focus-border-width = 1
focus-border-alpha = 0.12

selected-color        = "#1a1a1a"
selected-fill-alpha   = 0.07
selected-border       = "#1a1a1a"
selected-border-width = 0
selected-border-alpha = 0

pressed-fill-alpha   = 0.09
selection-fill-alpha = 0.35

# ---------------------------------------------------------------- geometry
# Base 4. Unit 32. Radius 24 (from Hyprland decoration:rounding, config layer);
# padding = radius = 24. Every value here is on the 4px grid except
# xxs, a deliberate half-unit for hairline insets. The reference grid is 8px;
# 8 is the module here, 4 its subdivision. md (12) and xl (20) are the two
# sub-module steps, kept only because upstream names nine ramp slots.
#
# The grid is fixed. [font] and [spacing] per-token overrides do not scale
# with base-size (only [bar] does), so scale-with-font is off everywhere and
# density is a preset, not a slider.

[spacing]
scale           = 1.0
scale-with-font = false
xxs  = 2
xs   = 4
sm   = 8
md   = 12
lg   = 16
xl   = 20
xxl  = 24
xxxl = 32
huge = 48
control-gap                 = 8
control-padding-x           = 20
control-padding-y           = 8
input-padding-y             = 8
control-height              = 40
popup-row-height            = 40
row-gap                     = 12
row-padding-x               = 16
label-gap                   = 4
panel-gap                   = 16
panel-padding               = 24
popup-padding               = 24
dropdown-width              = 240
searchable-dropdown-width   = 260
number-field-width          = 120
searchable-popup-min-height = 288

[font]
# Pinned. 12 / 14 / 16 / 18 / 24 / 56. Minimum step 2px. display-large is the
# hero numeral (battery percentage, temperature); display stays 24 so panel
# hero glyphs match icon-large. caption and
# body-small collapse to 11; body and subtitle collapse to 13. Two tokens
# that cannot be told apart are one value.
base-size     = 14
caption       = 12
body-small    = 12
body          = 14
subtitle      = 14
title         = 16
heading       = 18
display       = 24
display-large = 56
# Icons are Material Design Icons on their own grid, not the type scale.
icon-small = 16
icon       = 20
icon-large = 24

# ---------------------------------------------------------------- surfaces

[popups]
background       = "#ffffff"
background-alpha = 1.0
text             = "#1a1a1a"
border           = "#1a1a1a"
border-alpha     = 0.10
border-width     = 1

[tooltip]
background       = "#ffffff"
background-alpha = 1.0
text             = "#1a1a1a"
border           = "#ffffff"
border-alpha     = 0
border-width     = 0

[notifications]
# Marvin's signature card, the same navy the battery panel wears — a
# notification is the one thing that floats over whatever you are doing, so it
# reads as the theme rather than as the app that sent it. White ink, and the
# hairline is white too: a dark border would disappear into the tint.
background       = "#33405b"
background-alpha = 1.0
text             = "#ffffff"
border           = "#ffffff"
border-alpha     = 0.14
border-width     = 1
# Progress is a hairline; its fill is accent because time left means something.
countdown        = "#6db8ee"

[launcher]
background                = "#ffffff"
background-alpha          = 1.0
text                      = "#1a1a1a"
border           = "#1a1a1a"
border-alpha     = 0.10
border-width     = 1
scrim                     = "#1a1a1a"
scrim-alpha               = 0.3
# Selection is a fill, not a color change. Accent stays rationed.
selected-background       = "#1a1a1a"
selected-background-alpha = 0.07
selected-text             = "#1a1a1a"
selected-border           = "#1a1a1a"
selected-border-alpha     = 0
selected-border-width     = 0

[menu]
background                = "#ffffff"
background-alpha          = 1.0
text                      = "#1a1a1a"
border           = "#1a1a1a"
border-alpha     = 0.10
border-width     = 1
scrim                     = "#1a1a1a"
scrim-alpha               = 0.3
selected-background       = "#1a1a1a"
selected-background-alpha = 0.07
selected-text             = "#1a1a1a"
selected-border           = "#1a1a1a"
selected-border-alpha     = 0
selected-border-width     = 0

[polkit]
background         = "#ffffff"
background-alpha   = 1.0
text               = "#1a1a1a"
text-error         = "#c03a3a"
# Idle has no border. Error is a state signal, so it may draw one.
border             = "#ffffff"
border-width       = 0
border-error       = "#c03a3a"
border-error-width = 2
border-alpha       = 1.0
scrim              = "#1a1a1a"
scrim-alpha        = 0.3
accent             = "#2f93d3"

[lock]
background          = "#ffffff"
background-alpha    = 0.85
text                = "#1a1a1a"
placeholder         = "#6b6b6b"
text-error          = "#c03a3a"
# Idle: no border. Typing: a hairline of the text colour. Wrong password: red.
border              = "#ffffff"
border-width        = 0
border-active       = "#1a1a1a"
border-active-width = 1
border-error        = "#c03a3a"
border-error-width  = 2
border-alpha        = 0.12
selection           = "#2f93d3"
selection-alpha     = 0.35

[image-picker]
scrim                   = "#1a1a1a"
scrim-alpha             = 0.6
text                    = "#1a1a1a"
selected-border         = "#2f93d3"
selected-border-alpha   = 1.0
unselected-border       = "#1a1a1a"
unselected-border-alpha = 0.2

# ---------------------------------------------------------------- widgets
# Per-widget tone. Structure never changes; only the surface does.

# The reference's gradients, verbatim: sky for weather, navy for the battery.
# White type on a gradient is measured against the deeper stop at AA large
# (3:1), because everything set on these surfaces is large. Tested.
# The weather card is a sky. Day is the reference's blue; the plugin switches
# to sunset in the first and last hours of daylight and to night after dark
# (Open-Meteo's is_day), each its own gradient. Text stays white.
[marvin-weather]
# Day is a deep afternoon blue, not a powder blue: white text needs the
# contrast (a light day sky read at ~2.6:1). Sunset and night are already dark.
background     = "#4d7bb0"
background-end = "#2b5687"
text           = "#ffffff"
muted          = "#eaf2fb"
sunset         = "#f2b27a"
sunset-end     = "#8a6bb3"
sunset-muted   = "#fbe9d8"
night          = "#2c3a5c"
night-end      = "#0f1626"
night-muted    = "#b8c1d3"

# The reference's dark card, on both tones. The chip is a soft fill of the
# attention hue with lighter text of the same hue.
[marvin-power]
background     = "#33405b"
background-end = "#1b2436"
text           = "#ffffff"
muted          = "#b8c1d3"

# The one status chip in the reference: the note's "Draft", pale yellow with
# olive text. Every other state (the focus card's "In progress") is muted text.
[marvin-chip]
attention-fill = "#f9ecad"
attention-text = "#574611"
