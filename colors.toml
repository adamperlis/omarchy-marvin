# Marvin — dark. Neutral ramp, one accent, one attention role.
# Every pair that matters is measured against a contrast floor; see
# docs/principles.md. Do not tune by eye.
mode = "dark"

accent      = "#6db8ee"
accent_text = "#6db8ee"
attention   = "#6db8ee"
selection = "#303030"
muted     = "#8c8c8c"

background         = "#161616"
dark_background    = "#0f0f0f"
darker_background  = "#0a0a0a"
lighter_background = "#1e1e1e"

foreground        = "#d6d6d6"
dark_foreground   = "#8c8c8c"
light_foreground  = "#e6e6e6"
bright_foreground = "#f5f5f5"

red     = "#e38484"
green   = "#98c78c"
yellow  = "#dfbf72"
blue    = "#6db8ee"
magenta = "#c4a0dc"
cyan    = "#82c9c9"

# Names upstream's app templates ask for that a neutral ramp does not
# carry. Set here so every template — not just the files Marvin ships —
# takes Marvin's value instead of a derived one. Left unset, orange
# resolves onto yellow and flattens enumMember against class in the
# editor themes. Both sit in the ramp's own band; test/contrast holds them.
orange  = "#e0a273"
brown   = "#a37857"

# Positional ANSI names. Some apps read the palette by slot rather than by
# role — voxtype's dictation OSD colours its level meter from color1/2/3 and
# falls back to its own saturated built-ins when they are absent, which is
# how a lime-green meter ended up on a Marvin ground. Aliases of the ramp's
# own red/green/yellow; test/contrast pins them so they cannot drift.
color1  = "#e38484"  # danger  — mirrors red
color2  = "#98c78c"  # safe    — mirrors green
color3  = "#dfbf72"  # warning — mirrors yellow

bright_red     = "#ee9a9a"
bright_green   = "#aed6a3"
bright_yellow  = "#ead08e"
bright_blue    = "#8fcbf4"
bright_magenta = "#d5b8e8"
bright_cyan    = "#9cd8d8"

# Window focus is the one border that must stay visible. Foreground at 55%
# for the focused window, 12% for the rest. Feeds hyprland.lua.tpl.
hyprland_active_border   = "rgba(d6d6d68c)"
hyprland_inactive_border = "rgba(d6d6d61f)"
